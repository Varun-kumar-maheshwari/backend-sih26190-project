version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: sakshyasetu-minio
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbuckets:
    image: minio/mc
    container_name: sakshyasetu-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 admin supersecretpassword;
      /usr/bin/mc mb myminio/sakshyasetu-evidence --ignore-existing;
      exit 0;
      "

volumes:
  miniodata: